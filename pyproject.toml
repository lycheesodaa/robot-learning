[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-safety"
version = "0.1.0"
description = "MolmoAct2 internal and external safety research scaffold"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.2.6", "Pillow==11.2.1"]

[project.optional-dependencies]
policy = ["torch==2.7.1", "torchvision==0.22.1", "transformers==5.3.0", "huggingface-hub==1.7.2", "accelerate==1.8.1", "einops==0.8.1", "requests==2.32.4"]
dev = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
